ies(beach)}

  function openRiskInfo(){openModal("위험도 산정 기준",`<p class="modal-note">점수 색상 의미</p><div class="risk-legend"><div class="legend-row"><i class="color-dot" style="background:#22a866"></i><span>0~1</span><span>초록색</span></div><div class="legend-row"><i class="color-dot" style="background:#f19a2a"></i><span>2~5</span><span>주황색</span></div><div class="legend-row"><i class="color-dot" style="background:#e54848"></i><span>6~8</span><span>빨간색</span></div><div class="legend-row"><i class="color-dot" style="background:#15191c"></i><span>9~10</span><span>검은색</span></div></div><div class="criteria-tabs" role="tablist"><button class="criteria-tab active" data-criteria="jellyfish">해파리</button><button class="criteria-tab" data-criteria="ripCurrent">이안류</button><button class="criteria-tab" data-criteria="swellWave">너울성 파도</button></div><div id="criteria-content">${criteriaHTML("jellyfish")}</div><div class="criteria-warning">※ 공식기관이 발표한 원래 기준과 앱 표시용 환산을 구분합니다. 확인되지 않은 세부 기준이나 실제 위험도 수치는 만들지 않습니다.</div>`)}
  document.addEventListener("click",e=>{const moreMenu=document.getElementById("more-menu");if(e.target.closest("#more-button")){moreMenu.hidden=!moreMenu.hidden;document.getElementById("more-button").setAttribute("aria-expanded",String(!moreMenu.hidden));return}if(!e.target.closest(".more-wrap")){moreMenu.hidden=true;document.getElementById("more-button").setAttribute("aria-expanded","false")}if(e.target.closest("#info-button")){openRiskInfo();return}if(e.target.closest(".modal-close")||e.target.id==="app-modal"){closeModal();return}const criteria=e.target.closest("[data-criteria]");if(criteria){selectCriteria(criteria.dataset.criteria);return}const help=e.target.closest("[data-help]");if(help){const item=helpText[help.dataset.help];openModal(item.title,`<p>${item.body}</p>`);return}const pageButton=e.target.closest("[data-page]");if(pageButton)showPage(pageButton.dataset.page);const month=e.target.closest("[data-month]");if(month){selectedMonth=Number(month.dataset.month);renderMonths()}const source=e.target.closest(".source-btn:not(:disabled)");if(source?.dataset.url)window.open(source.dataset.url,"_blank","noopener")});

  function formatRipCurrentObservation(data){const values=[];if(data.obsrvnDt)values.push(`관측 ${data.obsrvnDt}`);if(data.lastScr!==null&&data.lastScr!==undefined&&data.lastScr!=="")values.push(`지수 ${data.lastScr}`);if(data.whght!==null&&data.whght!==undefined&&data.whght!=="")values.push(`파고 ${data.whght}`);return values.join(" · ")||null}

  async function loadRipCurrent(){const beach=beachData[selectedBeach],item=beach.ripCurrent,beachCode=ripCurrentBeachCodes[selectedBeach];if(!beachCode){item.score=null;item.officialStage=null;item.observation=null;item.updatedAt=null;item.source=null;item.url=null;item.error=null;renderRisks();return}const requestId=++ripCurrentRequestId;item.error=null;try{const response=await fetch(`/.netlify/functions/rip-current?beachCode=${encodeURIComponent(beachCode)}`,{headers:{Accept:"application/json"}});const result=await response.json().catch(()=>null);if(!response.ok||!result?.ok||!result.data)throw new Error("DATA_UNAVAILABLE");if(requestId!==ripCurrentRequestId||ripCurrentBeachCodes[selectedBeach]!==beachCode)return;const data=result.data;item.officialStage=officialStageFromMessage(data.lastScrCn);item.score=null;item.observation=formatRipCurrentObservation(data);item.updatedAt=data.obsrvnDt||null;item.source="국립해양조사원 이안류 지수 조회";item.url="https://www.data.go.kr/data/15156028/openapi.do";item.error=null;beach.updatedAt=data.obsrvnDt||beach.updatedAt;renderRisks()}catch(_){if(requestId!==ripCurrentRequestId||ripCurrentBeachCodes[selectedBeach]!==beachCode)return;item.score=null;item.officialStage=null;item.observation=null;item.updatedAt=null;item.source=null;item.url=null;item.error="데이터 불러오기 실패";renderRisks();showRipCurrentError()}}

  function waveBand(height){if(!validScore(height))return {label:"최신 파도 정보를 불러오지 못했습니다",color:"#aebbc1"};const h=Number(height);if(h<2)return {label:"공식 높은 물결 기준 미만",color:"#1687c5"};if(h<3)return {label:"높은 물결",color:"#e5b52f"};if(h<5)return {label:"풍랑주의보 파고 기준 이상",color:"#f19a2a"};return {label:"풍랑경보 파고 기준 이상",color:"#e54848"}}

  const RIP_CURRENT_SERVICE_KEY="A18zHdOTP4zxnI0Ftmbnk5ssejfUL4aNVse64TBgvkVHU2EVb9hpe%2FQ9ono%2BjTv4QzsGWFIIs6ZbbEHrTehK7w%3D%3D";

  let ripCurrentIntervalId=null;

  function koreaTodayYYYYMMDD(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const value=Object.fromEntries(parts.map(({type,value})=>[type,value]));return `${value.year}${value.month}${value.day}`}
  function formatObservationTime(value){const digits=String(value||"").replace(/\D/g,"");if(digits.length>=12)return `${digits.slice(4,6)}월 ${digits.slice(6,8)}일 ${digits.slice(8,10)}:${digits.slice(10,12)}`;return value||"--"}
  function newestObservation(items){return items.filter(item=>item&&item.obsrvnDt).sort((a,b)=>String(b.obsrvnDt).localeCompare(String(a.obsrvnDt)))[0]||null}
  function officialStageFromMessage(message){const text=String(message||"");return ["관심","주의","경계","위험"].find(stage=>text.includes(stage))||null}

  function ripCurrentObservation(data){const values=[];if(data.lastScrCn)values.push(data.lastScrCn);if(data.lastScr!==null&&data.lastScr!==undefined&&data.lastScr!=="")values.push(`지수 ${data.lastScr}`);if(data.wvhgt!==null&&data.wvhgt!==undefined&&data.wvhgt!=="")values.push(`파고 ${data.wvhgt}`);return values.join(" · ")||null}
  async function fetchRipCurrentData(beachCode){const reqDate=koreaTodayYYYYMMDD();const url=`${RIP_CURRENT_API_URL}?serviceKey=${RIP_CURRENT_SERVICE_KEY}&pageNo=1&numOfRows=300&type=json&beachCode=${beachCode}&reqDate=${reqDate}`;const response=await fetch(url,{headers:{Accept:"application/json"}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const payload=await response.json();const rawItems=payload?.response?.body?.items?.item??payload?.body?.items?.item??[];const latest=newestObservation(Array.isArray(rawItems)?rawItems:[rawItems]);if(!latest)throw new Error("EMPTY_DATA");return latest}
  async function loadRipCurrentData(){const beach=beachData[selectedBeach],item=beach.ripCurrent,beachCode=ripCurrentBeachCodes[selectedBeach];if(!beachCode){Object.assign(item,{score:null,officialStage:null,observation:"데이터 없음",updatedAt:null,source:null,url:null,error:null});renderRisks();return}const requestId=++ripCurrentRequestId;try{const data=await fetchRipCurrentData(beachCode);if(requestId!==ripCurrentRequestId||ripCurrentBeachCodes[selectedBeach]!==beachCode)return;Object.assign(item,{score:null,officialStage:officialStageFromMessage(data.lastScrCn),observation:ripCurrentObservation(data),updatedAt:formatObservationTime(data.obsrvnDt),source:"국립해양조사원 이안류 지수 조회",url:"https://www.data.go.kr/data/15156028/openapi.do",error:null});beach.updatedAt=formatObservationTime(data.obsrvnDt);renderRisks()}catch(error){console.error("이안류 API 호출 실패:",error);if(requestId!==ripCurrentRequestId||ripCurrentBeachCodes[selectedBeach]!==beachCode)return;Object.assign(item,{score:null,officialStage:null,observation:"데이터 불러오기 실패",updatedAt:null,source:null,url:null,error:"데이터 불러오기 실패"});renderRisks()}}
