  function criteriaHTML(key){if(key!=="jellyfish"){const c=riskCriteria[key];return `<div class="criteria-section"><h3>판단에 사용되는 자료</h3><ul class="criteria-list">${c.inputs.map(v=>`<li>${v}</li>`).join("")}</ul></div><div class="criteria-section"><h3>공식 기준</h3><ul class="criteria-list">${c.official.map(v=>`<li>${v}</li>`).join("")}</ul></div><div class="criteria-section"><h3>앱 위험도 환산</h3><p>${c.conversion}</p></div><div class="criteria-section"><h3>출처</h3><p>${c.source}</p><a class="official-link" href="${c.url}" target="_blank" rel="noopener noreferrer">공식 자료 보기</a></div>`}const rows=jellyfishRegionalRates.map(([region,nomura,moon,other])=>`<tr class="${region==="부산"?"busan-row":""}"><td>${region}</td><td>${nomura}</td><td>${moon}</td><td>${other}</td></tr>`).join("");return `<div class="criteria-section"><h3>공식 지역별 출현율 표</h3><p>국립수산과학원 해파리 모니터링 주간보고 14회차, 조사기간 ${jellyfishWeeklyReport.period}</p><div class="jelly-rate-wrap"><table class="jelly-rate-table"><thead><tr><th>지역</th><th>노무라</th><th>보름달</th><th>기타</th></tr></thead><tbody>${rows}</tbody></table></div><p>단위: %. ‘-’는 해당 보고서 표에 값이 기재되지 않은 항목입니다.</p></div><div class="criteria-section"><h3>출현율의 의미</h3><p>지역별 응답인원 중 해파리 종류별 발견자 비율입니다. 한 사람이 여러 종을 발견한 경우 각 종의 출현율에 반영됩니다.</p></div><div class="criteria-section"><h3>앱 위험도 환산</h3><p>공식 0~10 환산 기준은 확인되지 않아 점수로 환산하지 않습니다. 이 값은 지난 조사기간에 취합·분석한 집계 결과이며 실시간 관측값이 아닙니다.</p></div><div class="criteria-section"><h3>출처</h3><p>${jellyfishWeeklyReport.source}</p><a class="official-link" href="${jellyfishWeeklyReport.url}" target="_blank" rel="noopener noreferrer">공식 주간보고 보기</a></div>`}
  function loadJellyfishData(){for(const beach of Object.values(beachData)){Object.assign(beach.jellyfish,{score:null,nomura:jellyfishWeeklyReport.nomura,moon:jellyfishWeeklyReport.moon,other:jellyfishWeeklyReport.other,observation:`조사기간 ${jellyfishWeeklyReport.period} 집계 결과`,updatedAt:jellyfishWeeklyReport.publishedAt,source:jellyfishWeeklyReport.source,url:jellyfishWeeklyReport.url,error:null});beach.updatedAt=jellyfishWeeklyReport.publishedAt}renderRisks()}
